name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end smoke test
        run: |
          DATA_DIR=$RUNNER_TEMP/data PORT=3000 node build > $RUNNER_TEMP/server.log 2>&1 &
          bash scripts/smoke.sh http://127.0.0.1:3000 || { cat $RUNNER_TEMP/server.log; exit 1; }
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t board-of-bored:ci .
      - name: Smoke test the image
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name bob -p 3000:3000 -v "$PWD/data:/data" board-of-bored:ci
          bash scripts/smoke.sh http://127.0.0.1:3000 || { docker logs bob; exit 1; }
          docker exec bob sh -c 'mkdir -p /data/.backup && node scripts/db-backup.mjs /data/.backup/board.db'
          test -s data/.backup/board.db
          echo "backup snapshot ok"
